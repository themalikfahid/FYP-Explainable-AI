# Render blueprint: one web service that serves the API and the built frontend.
# Set DATABASE_URL (Neon Postgres connection string) and SECRET_KEY in the Render dashboard.
services:
  - type: web
    name: clarity-screen
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements-prod.txt &&
      cd frontend && npm ci && npm run build
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: NODE_VERSION
        value: 22
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_MODE
        value: disabled
